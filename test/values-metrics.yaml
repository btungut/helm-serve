### ─────────────────────────────────────────────────────────────────────────
### Metrics & Observability example  (NEW in v0.2.2)
### ─────────────────────────────────────────────────────────────────────────
###
### This file is a focused walkthrough of the `metrics` block introduced in
### v0.2.2. Pair it with `values-basic.yaml` if you only want a Deployment +
### metrics endpoint, or with `values-full.yaml` for the complete picture.
###
### What gets generated when `metrics.enabled: true`?
###
###   ┌─ Pod                              an extra `metrics` containerPort
###   ├─ Service `<release>-metrics`      ClusterIP, port 9211 → `metrics`
###   ├─ ServiceMonitor (optional)        scraped by Prometheus Operator
###   └─ PrometheusRule  (optional)       alert + recording rules
###
### Prometheus Operator (kube-prometheus-stack) is required for the
### ServiceMonitor and PrometheusRule resources.
### ─────────────────────────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

shared:
  metricsPort: "9090"

deployment:
  replicaCount: 2
  containerPort: 8080

  image:
    repository: myrepo/my-observable-app
    tag: latest

  env:
    METRICS_PORT: "{{ .Values.shared.metricsPort }}"
    LOG_LEVEL: "info"

service:
  enabled: true
  port: 80

### ── Metrics ──────────────────────────────────────────────────────────────
metrics:

  ### Master switch.
  enabled: true

  ### Port your application listens on for /metrics. Supports `tpl`.
  metricsPort: "{{ .Values.shared.metricsPort }}"

  ### Path served by your /metrics handler. Forwarded to ServiceMonitor.
  path: /metrics

  ### Extra labels merged onto the metrics Service, ServiceMonitor and
  ### PrometheusRule. Use this to match `serviceMonitorSelector` /
  ### `ruleSelector` of your Prometheus instance.
  labels:
    release: kube-prometheus-stack
    team: platform

  ### ── ServiceMonitor (Prometheus Operator CRD) ──────────────────────────
  serviceMonitor:
    enabled: true
    interval: "30s"
    scrapeTimeout: "10s"
    scheme: "http"
    honorLabels: false

    ### Standard relabel hooks. Both blocks are run through `tpl`.
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: k8s_namespace

    metricRelabelings:
      - sourceLabels: [__name__]
        regex: "go_gc_.*"
        action: drop

  ### ── PrometheusRule (Prometheus Operator CRD) ─────────────────────────
  ### Provide alert and/or recording rules. Omit this block (or pass an
  ### empty `rules` list) to skip the PrometheusRule resource entirely.
  prometheusRule:
    rules:
      ### Alerting rule
      - alert: "{{ .Release.Name }}HighErrorRate"
        expr: 'sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.05'
        for: "10m"
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "High 5xx rate on {{ .Release.Name }}"
          description: "More than 5% of HTTP requests have failed in the last 10 minutes."

      ### Alerting rule – pod restarts
      - alert: "{{ .Release.Name }}PodCrashLooping"
        expr: 'rate(kube_pod_container_status_restarts_total{namespace="{{ .Release.Namespace }}"}[15m]) > 0'
        for: "5m"
        labels:
          severity: critical
        annotations:
          summary: "Pod is crash-looping in {{ .Release.Namespace }}"

      ### Recording rule
      - record: "job:http_inprogress_requests:sum"
        expr: 'sum by(job) (http_inprogress_requests)'
