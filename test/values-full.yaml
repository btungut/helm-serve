### Example configuration for Deployment mode (API/Web applications)
### Deployment mode is activated by defining the `deployment` section below
### For CronJob mode, see values-cronjob.yaml

nameOverride: ""
fullnameOverride: ""

### You can define shared values here to be used across multiple sub-charts
shared:
  imagePullSecretName: "our-common-pull-secret-name"
  someOtherSharedValue: "shared-value-123"
  valueForPort: "3032"

### You can define a custom template prefix to be used in all templates
### If not defined, the chart name will be used as the prefix
templatePrefix: "overriden-tpl-prefix"

### Values for the deployment (rendered when `deployment` key is present in values)
deployment:

  ### Number of desired pods 
  replicaCount: 2

  ### Port to be exposed by the container
  containerPort: "{{ .Values.shared.valueForPort }}"
  
  ### Pod termination grace period in seconds
  terminationGracePeriodSeconds: 12

  ### Revision history limit for the deployment
  revisionHistoryLimit: 1 # default is 0 in the base chart for gitops compatibility
  
  ### Image pull secrets for the deployment pods
  imagePullSecrets:
    - name: "{{ .Values.shared.imagePullSecretName }}"
  
  ### Container image settings
  image:
    repository: myrepo
    tag: latest

  ### Custom labels for deployment metadata
  labels:
    buraktungut.com/custom-deployment-label: "Visit github.com/btungut"

  ### Custom annotations for POD metadata
  podAnnotations:
    buraktungut.com/custom-pod-annotation: "Hello from annotation"

  ### ConfigMap contents can be passed to pods as shown below, please pay attention to the `required` fields
  ### In this scenerio, if `my-configmap` is not found, the pod will not start
  configMaps:
    - name: my-configmap
      required: true
    - name: another-configmap
      required: false

  ### Secrets can be passed to pods as shown below, please pay attention to the `required` fields
  ### In this scenerio, if `my-secret` is not found, the pod will not start
  secrets:
    - name: my-secret
      required: true
    - name: another-secret
      required: false

  ### Custom environment variables for the container
  ### You can use template syntax to reference other values
  env:
    hello: world123
    env_from_shared_value: "{{ .Values.shared.someOtherSharedValue }}"
    env_from_helm_context: "{{ .Release.Name }}-{{ .Release.Namespace }}"
    APP_PORT: "{{ .Values.shared.valueForPort }}"


  ### Resource requests and limits for the container
  ### If not specified, 200m CPU and 256Mi memory requests/limits will be set by default to protect the cluster
  resources: {}
  


  ### You can specify custom probes for the container, otherwise no probes will be set
  startupProbe: 
    httpGet:
      path: /overriden/url
      port: "app" ### `app` is the default name of container name and container port!
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 6
    successThreshold: 1
    timeoutSeconds: 1


  livenessProbe: {}
  readinessProbe: {}



### Service settings, can be disabled
service:

  ### Enable or disable the service creation
  enabled: true

  ### Custom name for the service
  ### ONLY OVERRIDE IF YOU KNOW WHAT YOU ARE DOING
  name: "custom-service-name"

  ### Custom labels for service metadata
  labels:
    buraktungut.com/custom-service-label: "ServiceLabelValue"

  ### Service type, can be ClusterIP, NodePort, LoadBalancer, etc.
  type: NodePort

  ### Service port to be exposed, a.k.a. outbound port
  port: 80

  ### NodePort value, only required if service type is NodePort
  nodePort: 31999


### Ingress settings, can be disabled
ingress:

  ### Enable or disable the ingress creation
  enabled: true

  ### Ingress controller class name
  className: "nginx"

  ### Custom name for the ingress
  ### ONLY OVERRIDE IF YOU KNOW WHAT YOU ARE DOING
  name: "custom-ingress-name"

  ### Custom labels for ingress metadata
  labels:
    buraktungut.com/custom-ingress-label: "IngressLabelValue"

  ### Custom annotations for ingress metadata
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
  
  ### Rule settings for the ingress, only one rule is supported in this base chart
  rule:
    host: "mycompany.local"
    path: /myapp(/|$)(.*)
    pathType: ImplementationSpecific
    ### You do not need to specify the service name and port here, they will be set automatically


### Metrics & Observability (NEW in v0.2.2) ─────────────────────────────────
###
### A single switch (`metrics.enabled`) wires the workload into a complete
### Prometheus stack:
###
###   1. Container             – an additional `metrics` port is exposed on
###                              the Pod (containerPort = metrics.metricsPort)
###   2. Service               – a dedicated `<release>-metrics` ClusterIP
###                              Service is rendered on port 9211, targeting
###                              the `metrics` containerPort
###   3. ServiceMonitor (CRD)  – created when `metrics.serviceMonitor.enabled`
###                              is true; selects the metrics Service
###   4. PrometheusRule (CRD)  – created when rules are provided under
###                              `metrics.prometheusRule.rules`
###
### NOTE: ServiceMonitor & PrometheusRule require the Prometheus Operator
###       (kube-prometheus-stack) to be installed in the cluster.
metrics:

  ### Master switch – when false, no metrics resources are rendered.
  enabled: true

  ### Container port that exposes /metrics inside the Pod (REQUIRED).
  ### Supports `tpl` so you can pull it from `shared` or any other value.
  metricsPort: 9090

  ### Path under which the application exposes Prometheus metrics.
  path: /metrics

  ### Extra labels merged onto the metrics Service, ServiceMonitor and
  ### PrometheusRule metadata. Useful for Prometheus Operator's
  ### `serviceMonitorSelector` matching.
  labels:
    release: kube-prometheus-stack
    buraktungut.com/observability: "true"

  serviceMonitor:

    ### Render the ServiceMonitor CR (requires Prometheus Operator CRDs).
    enabled: true

    ### How often Prometheus scrapes the target.
    interval: "30s"
    scrapeTimeout: "10s"

    ### http or https
    scheme: "http"

    ### Honor labels reported by the target over Prometheus-side labels.
    honorLabels: true

    ### Standard ServiceMonitor relabel/metricRelabel hooks – passed through
    ### verbatim. `tpl` is applied so you can reference values from `shared`.
    relabelings:
      - sourceLabels: [__meta_kubernetes_pod_node_name]
        targetLabel: node

    metricRelabelings:
      - sourceLabels: [__name__]
        regex: "go_.*"
        action: drop

  prometheusRule:

    ### Provide one or more rules (alerts / recording rules) to render a
    ### PrometheusRule CR. Pass an empty list to skip the resource.
    rules:
      - alert: "{{ .Release.Name }}HighErrorRate"
        expr: 'sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.05'
        for: "10m"
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: "High 5xx rate on {{ .Release.Name }}"
          description: "More than 5% of requests are failing for the last 10 minutes."
      - record: "job:http_inprogress_requests:sum"
        expr: 'sum by(job) (http_inprogress_requests)'