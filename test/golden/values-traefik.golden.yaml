# Source: testing-api/templates/ingress.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-smoke-testing-api-web
  labels:
    helm.sh/chart: testing-api-0.0.0
    app.kubernetes.io/name: testing-api
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
spec:
  entryPoints:
    - "web"
    - "websecure"
  routes:
    - match: "Host(`api.mycompany.local`)"
      kind: Rule
      middlewares:
        - name: "middleware-smoke-testing-api-secure-headers"
        - name: "middleware-smoke-testing-api-app-context"
      services:
        - name: smoke-testing-api
          port: 80
---
# Source: testing-api/templates/ingress.yaml
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ingressroute-smoke-testing-api-api
  labels:
    helm.sh/chart: testing-api-0.0.0
    app.kubernetes.io/name: testing-api
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
    exposure: internal
  annotations:
    description: internal api route
spec:
  entryPoints:
    - "web"
  routes:
    - match: "Host(`api.mycompany.local`) && PathPrefix(`/api`)"
      kind: Rule
      priority: 10
      middlewares:
        - name: "middleware-smoke-testing-api-secure-headers"
        - name: "shared-ratelimit"
          namespace: "traefik-system"
      services:
        - name: 'smoke-grpc'
          port: 9000
          scheme: h2c
