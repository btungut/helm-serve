# Source: testing-api/templates/ingress.yaml
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: middleware-smoke-testing-api-secure-headers
  labels:
    helm.sh/chart: testing-api-0.0.0
    app.kubernetes.io/name: testing-api
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
spec:
  headers:
    customRequestHeaders:
      X-Custom-Header: my-custom-header
    customResponseHeaders:
      X-Custom-Response-Header: my-custom-response-header
    forceSTSHeader: true
    sslRedirect: true
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
