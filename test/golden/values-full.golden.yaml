# Source: testing-api/templates/deployment.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: smoke-testing-api-metrics
  labels:
    helm.sh/chart: testing-api-0.0.0
    app.kubernetes.io/name: testing-api
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
    buraktungut.com/observability: "true"
    release: kube-prometheus-stack
spec:
  groups:
    - name: smoke-testing-api-metrics
      rules:
        - alert: 'smokeHighErrorRate'
          annotations:
            description: More than 5% of requests are failing for the last 10 minutes.
            summary: High 5xx rate on smoke
          expr: sum(rate(http_requests_total{status=~"5.."}[5m])) > 0.05
          for: 10m
          labels:
            owner: platform
            severity: warning
        - expr: sum by(job) (http_inprogress_requests)
          record: job:http_inprogress_requests:sum
---
# Source: testing-api/templates/deployment.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: smoke-testing-api-metrics
  labels:
    helm.sh/chart: testing-api-0.0.0
    app.kubernetes.io/name: testing-api
    app.kubernetes.io/instance: smoke
    app.kubernetes.io/managed-by: Helm
    buraktungut.com/observability: "true"
    release: kube-prometheus-stack
spec:
  endpoints:
    - port: http-metrics
      path: /metrics
      honorLabels: true
      interval: 30s
      scrapeTimeout: 10s
      scheme: http
      relabelings:
        - sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: node
      metricRelabelings:
        - action: drop
          regex: go_.*
          sourceLabels:
          - __name__
  selector:
    matchLabels:
      app.kubernetes.io/name: testing-api
      app.kubernetes.io/instance: smoke
  namespaceSelector:
    matchNames:
      - yorumjet-test-apps
