nameOverride: ""
fullnameOverride: ""

deployment:
  containerPort: 80
  
  image:
    repository: myrepo
    tag: latest


service:
  enabled: true
  port: 80


ingress:
  enabled: true
  className: "nginx"
  rule:
    host: "dev.myapi.mydomain.local"
    path: /

myenv:
  somekey: somevalue

additionalManifests: |
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: my-cm
    data:
      hard_coded_value: "my-hard-coded-value"
      value_from_template: "{{ $.Values.deployment.containerPort }}"
      {{- range $key, $value := $.Values.myenv }}
      {{ $key }}: {{ $value | quote }}
      {{- end }}
