### Example configuration for Deployment mode (API/Web applications)
### Deployment mode is activated by defining the `deployment` section below
### For CronJob mode, see values-cronjob.yaml

nameOverride: ""
fullnameOverride: ""

shared:
  imagePullSecretName: "our-common-pull-secret-name"

deployment:
  replicaCount: 2
  containerPort: 80
  terminationGracePeriodSeconds: 12
  
  imagePullSecrets:
    - name: "{{ .Values.shared.imagePullSecretName }}"
  
  image:
    repository: myrepo
    tag: latest

  configMaps:
    - name: app-env
      required: true

  secrets:
    - name: app-secrets
      required: true

  env:
    ASPNETCORE_ENVIRONMENT: "Production"


service:
  enabled: true
  type: NodePort
  port: 80
  nodePort: 31999


ingress:
  enabled: true
  className: "nginx"
  rule:
    host: "dev.myapi.mydomain.local"
    path: /


### Metrics (NEW in v0.2.2)
### When enabled, the chart automatically:
###   - exposes an additional `metrics` containerPort on the Pod
###   - renders a dedicated `<release>-metrics` ClusterIP Service on port 9211
### This minimal example only enables the metrics Service. ServiceMonitor and
### PrometheusRule are demonstrated in values-full.yaml and values-metrics.yaml.
metrics:
  enabled: true
  metricsPort: 9090
  path: /metrics